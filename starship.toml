"$schema" = "https://starship.rs/config-schema.json"

format = """
[╭─](bold #414868)\
[ $hostname ](bold #ff2d6b)\
[  ](bold #414868)\
$directory\
$git_branch\
$git_status\
$nodejs$python$rust$golang$bun\
$line_break\
[╰─](bold #414868)\
$character"""

add_newline = false

[character]
success_symbol = '[❯](bold #00ff9f)'
error_symbol = '[❯](bold #ff2d6b)'

[hostname]
ssh_only = false
format = '[$hostname]($style)'
style = 'bold #ff2d6b'
disabled = false

[directory]
style = 'bold #00e5ff'
read_only = ' 󰌾'
read_only_style = '#ff2d6b'
truncation_length = 3
truncate_to_repo = true
format = '[$path]($style)[$read_only]($read_only_style) '

[git_branch]
symbol = ' '
style = 'bold #bd00ff'
format = 'on [$symbol$branch]($style) '

[git_status]
style = '#ffd700'
format = '([$all_status$ahead_behind]($style) )'
conflicted = '⚡'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '✦'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

[nodejs]
symbol = ' '
style = 'bold #00ff9f'
format = '[$symbol($version )]($style)'

[bun]
symbol = ' '
style = 'bold #00ff9f'
format = '[$symbol]($style) '

[python]
symbol = ' '
style = 'bold #ffd700'
format = '[$symbol($version )]($style)'

[rust]
symbol = ' '
style = 'bold #ff6b9d'
format = '[$symbol($version )]($style)'

[golang]
symbol = ' '
style = 'bold #62eeff'
format = '[$symbol($version )]($style)'
